<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>اختيار كلمة مرور جديدة — TXT Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a1330" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/login.css" />
  <link rel="stylesheet" href="CSS/animations.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="nav">
    <div class="container">
      <a class="brand" href="index.html"><span class="brand-mark">T</span> TXT Vault</a>
    </div>
  </header>

  <main class="container auth-wrap">
    <section class="card auth-card enter">
      <h1>اختر كلمة مرور جديدة 🔐</h1>
      <p class="sub">دخلت بكلمة مرور مؤقتة. اختر كلمة مرور خاصة بيك عشان تكمل.</p>

      <div id="message" class="alert" hidden role="alert"></div>

      <form id="pwForm" novalidate onsubmit="return false">
        <div class="field">
          <label for="password">كلمة المرور الجديدة</label>
          <input class="input ltr" type="password" id="password" autocomplete="new-password" placeholder="٨ أحرف على الأقل" required />
          <div class="pw-meter" aria-live="polite">
            <div class="pw-bar"><span id="pwBarFill"></span></div>
            <div class="pw-label" id="pwLabel">اكتب كلمة المرور</div>
          </div>
          <ul class="pw-rules" id="pwRules">
            <li data-rule="len">٨ أحرف على الأقل</li>
            <li data-rule="lower">حرف إنجليزي صغير (a-z)</li>
            <li data-rule="upper">حرف إنجليزي كبير (A-Z)</li>
            <li data-rule="digit">رقم واحد على الأقل (0-9)</li>
            <li data-rule="special">رمز خاص واحد على الأقل مثل @ # $ !</li>
          </ul>
        </div>

        <div class="field">
          <label for="password2">تأكيد كلمة المرور</label>
          <input class="input ltr" type="password" id="password2" autocomplete="new-password" placeholder="أعد كتابتها" required />
          <div class="hint" id="pwMatch"></div>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">حفظ والمتابعة</button>
      </form>
    </section>
  </main>

  <script type="module" src="JS/pwa.js"></script>
  <script type="module" src="JS/change-password.js"></script>
</body>
</html>
