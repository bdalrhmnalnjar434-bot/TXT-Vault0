<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إنشاء حساب — TXT Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/login.css" />
  <link rel="stylesheet" href="CSS/animations.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="nav">
    <div class="container">
      <a class="brand" href="index.html"><span class="brand-mark">T</span> TXT Vault</a>
      <nav class="nav-actions"><a class="btn" href="login.html">تسجيل الدخول</a></nav>
    </div>
  </header>

  <main class="container auth-wrap">
    <section class="card auth-card wide enter">
      <h1>إنشاء حساب جديد</h1>
      <p class="sub">بعد التسجيل ستحتاج لربط تيليجرام وموافقة الإدارة قبل فتح المحتوى.</p>

      <div id="message" class="alert" hidden role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="fullName">الاسم الكامل</label>
          <input class="input" type="text" id="fullName" autocomplete="name" placeholder="اسمك الثلاثي" maxlength="100" required />
        </div>

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input class="input ltr" type="email" id="email" autocomplete="email" placeholder="name@example.com" required />
        </div>

        <div class="field">
          <label for="grade">الصف الدراسي</label>
          <select id="grade" required>
            <option value="first">أولى بكالوريا — JavaScript</option>
            <option value="second">ثانية بكالوريا — JavaScript وPython</option>
          </select>
          <div class="hint">يمكن للإدارة نقلك بين الصفوف لاحقًا.</div>
        </div>

        <div class="grid grid-2" style="gap:12px">
          <div class="field">
            <label for="password">كلمة المرور</label>
            <input class="input ltr" type="password" id="password" autocomplete="new-password" placeholder="٨ أحرف على الأقل" minlength="8" required />
          </div>
          <div class="field">
            <label for="password2">تأكيد كلمة المرور</label>
            <input class="input ltr" type="password" id="password2" autocomplete="new-password" placeholder="أعد كتابتها" required />
          </div>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">إنشاء الحساب</button>
      </form>

      <p class="auth-foot">لديك حساب؟ <a href="login.html">سجّل الدخول</a></p>
    </section>
  </main>

  <script type="module" src="JS/register.js"></script>
</body>
</html>
