<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول — TXT Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="CSS/style.css" />
  <link rel="stylesheet" href="CSS/login.css" />
  <link rel="stylesheet" href="CSS/animations.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="nav">
    <div class="container">
      <a class="brand" href="index.html"><span class="brand-mark">T</span> TXT Vault</a>
      <nav class="nav-actions"><a class="btn" href="register.html">إنشاء حساب</a></nav>
    </div>
  </header>

  <main class="container auth-wrap">
    <section class="card auth-card enter">
      <h1>أهلًا بعودتك 👋</h1>
      <p class="sub">سجّل الدخول للوصول إلى حسابك</p>

      <div id="message" class="alert" hidden role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input class="input ltr" type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com" required />
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="pw-field">
            <input class="input ltr" type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
            <button class="pw-toggle" type="button" id="pwToggle" aria-label="إظهار كلمة المرور">إظهار</button>
          </div>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">تسجيل الدخول</button>
      </form>

      <p class="auth-foot">ليس لديك حساب؟ <a href="register.html">أنشئ حسابًا جديدًا</a></p>
    </section>
  </main>

  <script type="module" src="JS/login.js"></script>
</body>
</html>
